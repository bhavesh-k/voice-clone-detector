<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Clone Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0&display=block" rel="stylesheet">
<style>
  :root {
    --page: #e9e8ee; --panel: #ffffff; --panel-line: #dddce3; --ink: #1b1b1f; --ink-2: #5d5c66;
    --real: #6dd58c; --fake: #ff6b5e;
    --font: "Google Sans", "Google Sans Text", "Roboto Flex", Roboto, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #121214; --panel: #1d1d21; --panel-line: #2e2e34; --ink: #e6e4ec; --ink-2: #9a98a3; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--page); color: var(--ink); font-family: var(--font);
         display: flex; justify-content: center; align-items: center; gap: 56px;
         min-height: 100vh; padding: 32px 16px; flex-wrap: wrap; }
  .icon { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1;
          letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr;
          -webkit-font-smoothing: antialiased; font-feature-settings: "liga"; user-select: none; }

  /* ---------------- demo controls (outside the phone) ---------------- */
  .controls { width: 300px; background: var(--panel); border: 1px solid var(--panel-line);
              border-radius: 20px; padding: 22px; }
  .controls h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
                 color: var(--ink-2); margin: 0 0 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .field .row { display: flex; gap: 8px; }
  select, .controls button { font: inherit; font-size: 14px; border-radius: 10px; border: 1px solid var(--panel-line);
                             background: var(--panel); color: var(--ink); padding: 9px 12px; }
  select { width: 100%; min-width: 0; }
  .controls button { cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .controls button .icon { font-size: 18px; }
  .controls button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  #status { font-size: 13px; color: var(--ink-2); margin-top: 4px; min-height: 1.4em; }

  /* ---------------- phone ---------------- */
  .phone { width: 372px; height: 800px; border-radius: 52px; background: #0b0b0c; padding: 11px;
           box-shadow: 0 0 0 2px #2a2a2e, 0 30px 80px rgba(0,0,0,.35); flex: none; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden;
            background: #111; color: #fff; }
  /* Caller photo: put one at static/caller.jpg. Without it the gradient underneath shows instead. */
  .wallpaper { position: absolute; inset: 0;
               background: url("/static/caller.jpg") center 30% / cover, linear-gradient(160deg, #3d4a6b, #1d2233 60%, #12141c); }
  .scrim { position: absolute; inset: 0;
           background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.12) 26%, rgba(0,0,0,0) 42%,
                                       rgba(0,0,0,.45) 62%, rgba(0,0,0,.88) 100%); }
  .punch { position: absolute; top: 12px; left: 50%; width: 13px; height: 13px; margin-left: -6.5px;
           border-radius: 50%; background: #000; box-shadow: 0 0 0 1.5px #1a1a1a; z-index: 5; }

  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 38px; padding: 0 26px;
               display: flex; align-items: center; justify-content: space-between;
               font-size: 14px; font-weight: 500; z-index: 4; }
  .statusbar .icons { display: flex; gap: 4px; align-items: center; }
  .statusbar .icon { font-size: 17px; }

  .header { position: absolute; top: 64px; left: 0; right: 0; text-align: center; z-index: 3;
            text-shadow: 0 1px 12px rgba(0,0,0,.35); }
  .header .sub { font-size: 15px; opacity: .9; letter-spacing: .01em; }
  .header .name { font-size: 40px; font-weight: 400; margin: 6px 0 4px; letter-spacing: -.01em; }
  .header .meta { font-size: 15px; opacity: .85; font-variant-numeric: tabular-nums; }

  /* detector card: the only addition to the stock call screen */
  .verdict { position: absolute; left: 26px; right: 26px; top: 196px; z-index: 3; padding: 14px 18px 10px;
             border-radius: 24px; background: rgba(16,16,18,.5);
             -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
             border: 1px solid rgba(255,255,255,.12);
             transition: opacity .35s ease, transform .35s ease; }
  .verdict.hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }
  .verdict.stale { opacity: .55; }
  .verdict .top { display: flex; align-items: baseline; justify-content: space-between; }
  .verdict .word { font-size: 30px; font-weight: 600; letter-spacing: .06em; transition: color .3s; }
  .verdict .pct { font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums; opacity: .92; }
  .verdict .word.listening { font-size: 17px; font-weight: 500; letter-spacing: .02em; opacity: .8; }
  .verdict svg { display: block; width: 100%; height: 44px; margin-top: 6px; overflow: visible; }

  /* in-call controls */
  .incall { position: absolute; left: 0; right: 0; bottom: 34px; z-index: 3; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 18px; padding: 0 28px; }
  .key { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; opacity: .95; }
  .key .disc { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
               background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .key .icon { font-size: 26px; }
  .end { display: flex; justify-content: center; margin-top: 30px; }
  .end button { width: 96px; height: 56px; border-radius: 28px; border: 0; cursor: pointer;
                background: #e3423c; color: #fff; display: grid; place-items: center; }
  .end .icon { font-size: 30px; }

  /* incoming call: Pixel's swipe-up-to-answer handle */
  .incoming { position: absolute; left: 0; right: 0; bottom: 46px; z-index: 3; text-align: center; }
  .chevrons { display: flex; flex-direction: column; align-items: center; margin-bottom: 4px; opacity: .8; }
  .chevrons .icon { font-size: 22px; line-height: 12px; animation: rise 1.6s ease-in-out infinite; }
  .chevrons .icon:nth-child(2) { animation-delay: .15s; opacity: .7; }
  @keyframes rise { 0%, 100% { transform: translateY(4px); opacity: .35; } 50% { transform: translateY(-4px); opacity: 1; } }
  .answer { width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer; margin: 6px auto 14px;
            background: #c4eed0; color: #0d4a22; display: grid; place-items: center;
            animation: bob 1.6s ease-in-out infinite; }
  .answer .icon { font-size: 34px; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .incoming .hint { font-size: 14px; opacity: .9; }
  .incoming .decline { margin-top: 18px; font-size: 13px; opacity: .7; background: none; border: 0;
                       color: #fff; cursor: pointer; font-family: inherit; }

  .hidden-state { display: none !important; }
</style>
</head>
<body>

<aside class="controls">
  <h2>Demo controls</h2>
  <div class="field">
    <label for="model">Model</label>
    <select id="model"></select>
  </div>
  <div class="field">
    <label>Microphone</label>
    <button id="micBtn"><span class="icon">mic</span><span>Start mic</span></button>
  </div>
  <div class="field">
    <label for="clip">Clip (plays on speakers, fed directly to the model)</label>
    <div class="row">
      <select id="clip"></select>
      <button id="playBtn"><span class="icon">play_arrow</span><span>Play</span></button>
    </div>
    <input id="file" type="file" accept="audio/*" hidden>
  </div>
  <div id="status">Idle</div>
</aside>

<div class="phone">
  <div class="screen">
    <div class="wallpaper"></div>
    <div class="scrim"></div>
    <div class="punch"></div>

    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="icons">
        <span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span>
      </span>
    </div>

    <div class="header">
      <div class="sub" id="callLabel">Incoming call</div>
      <div class="name">Bhavesh</div>
      <div class="meta" id="callMeta">Mobile</div>
    </div>

    <div class="verdict hidden" id="verdict">
      <div class="top">
        <span class="word" id="word"></span>
        <span class="pct" id="pct"></span>
      </div>
      <svg id="graph" viewBox="0 0 300 54" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="fill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="currentColor" stop-opacity=".35"/>
            <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="0" x2="300" y1="27" y2="27" stroke="rgba(255,255,255,.18)" stroke-width="1" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
        <path id="area" fill="url(#fill)"/>
        <path id="line" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <circle id="dot" r="3.6" fill="currentColor"/>
      </svg>
    </div>

    <div class="incall hidden-state" id="incall">
      <div class="grid">
        <div class="key"><span class="disc"><span class="icon">dialpad</span></span>Keypad</div>
        <div class="key"><span class="disc"><span class="icon">mic_off</span></span>Mute</div>
        <div class="key"><span class="disc"><span class="icon">volume_up</span></span>Speaker</div>
        <div class="key"><span class="disc"><span class="icon">add_call</span></span>Add call</div>
        <div class="key"><span class="disc"><span class="icon">pause</span></span>Hold</div>
        <div class="key"><span class="disc"><span class="icon">more_horiz</span></span>More</div>
      </div>
      <div class="end"><button id="endBtn" aria-label="End call"><span class="icon">call_end</span></button></div>
    </div>

    <div class="incoming" id="incoming">
      <div class="chevrons"><span class="icon">keyboard_arrow_up</span><span class="icon">keyboard_arrow_up</span></div>
      <button class="answer" id="answerBtn" aria-label="Answer"><span class="icon">call</span></button>
      <div class="hint">Swipe up to answer</div>
      <button class="decline" id="declineBtn">Swipe down to decline</button>
    </div>
  </div>
</div>

<script>
// Collects raw samples in the audio thread and hands them to the page.
const WORKLET = `
class Tap extends AudioWorkletProcessor {
  process(inputs) {
    if (inputs[0][0]) this.port.postMessage(inputs[0][0].slice());
    return true;
  }
}
registerProcessor('tap', Tap);`;

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// Session = WebSocket + 16 kHz context feeding the model. Mic and clips are sources plugged into it.
let socket, ctx16, tap;                 // model path
let ctxOut;                             // full-quality playback for the audience
let micStream, micNode;                 // mic, when on
let clipNodes = null;                   // the two players of the clip currently playing
let source = 'idle';                    // 'mic' | 'clip:<name>' | 'idle'
const localFiles = new Map();           // files picked with "Choose file…", kept so they can be replayed
let lastClip = '';                      // dropdown value to go back to if the file picker is cancelled

async function ensureSession() {
  if (socket?.readyState === WebSocket.OPEN) return;
  ctx16 = new AudioContext({ sampleRate: 16000 });  // the browser resamples everything to 16 kHz
  await ctx16.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
  tap = new AudioWorkletNode(ctx16, 'tap');

  socket = new WebSocket(`ws://${location.host}/ws`);
  socket.binaryType = 'arraybuffer';
  socket.onmessage = (e) => show(JSON.parse(e.data));
  socket.onclose = () => { if (ctx16) { $('status').textContent = 'Disconnected from server.'; endSession(); } };
  await new Promise((ok, fail) => { socket.onopen = ok; socket.onerror = () => fail(new Error('server not reachable')); });
  send({ contextSampleRate: ctx16.sampleRate, userAgent: navigator.userAgent, model: $('model').value });

  // Send ~100 ms batches instead of every 128-sample block.
  let pending = [], count = 0;
  tap.port.onmessage = (e) => {
    pending.push(e.data); count += e.data.length;
    if (count < 1600 || socket.readyState !== WebSocket.OPEN) return;
    const out = new Float32Array(count);
    let i = 0;
    for (const p of pending) { out.set(p, i); i += p.length; }
    socket.send(out.buffer);
    pending = []; count = 0;
  };
}

function endSession() {
  stopClip(false);
  micStream?.getTracks().forEach((t) => t.stop());
  micStream = micNode = null;
  ctx16?.close(); ctx16 = null;
  if (socket?.readyState === WebSocket.OPEN) socket.close();
  setSource('idle');
  setMicButton(false);
}

const send = (obj) => socket?.readyState === WebSocket.OPEN && socket.send(JSON.stringify(obj));

function setSource(s) {
  if (s === source) return;
  source = s;
  if (s !== 'idle') { send({ source: s }); answer(); }
  $('status').textContent = s === 'mic' ? '● Listening to mic' : s === 'idle' ? 'Idle' : `▶ Playing ${s.slice(5)}`;
  if (s !== 'idle' && !scores.length) listening();
}

// ---------- mic ----------

function setMicButton(on) {
  $('micBtn').classList.toggle('on', on);
  $('micBtn').innerHTML = `<span class="icon">${on ? 'stop' : 'mic'}</span><span>${on ? 'Stop mic' : 'Start mic'}</span>`;
}

async function startMic() {
  await ensureSession();
  // Echo cancellation, noise suppression and auto gain would reshape the voice before the model hears it.
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  });
  send({ micSettings: micStream.getAudioTracks()[0].getSettings() });
  micNode = ctx16.createMediaStreamSource(micStream);
  setMicButton(true);
  if (!clipNodes) { micNode.connect(tap); setSource('mic'); }
}

function stopMic() {
  micNode?.disconnect();
  micStream?.getTracks().forEach((t) => t.stop());
  micStream = micNode = null;
  setMicButton(false);
  if (!clipNodes) setSource('idle');
}

// ---------- clips ----------

async function playClip(name, bytes) {
  await ensureSession();
  stopClip(false);
  ctxOut ??= new AudioContext();
  // Decode twice: full rate for the speakers, 16 kHz for the model. Same file, started together.
  const [forSpeakers, forModel] = await Promise.all([
    ctxOut.decodeAudioData(bytes.slice(0)), ctx16.decodeAudioData(bytes.slice(0)),
  ]);
  micNode?.disconnect();  // pause the mic so it doesn't also pick the clip up from the speakers
  const speaker = new AudioBufferSourceNode(ctxOut, { buffer: forSpeakers });
  const model = new AudioBufferSourceNode(ctx16, { buffer: forModel });
  speaker.connect(ctxOut.destination);
  model.connect(tap);
  clipNodes = { speaker, model };
  model.onended = () => { if (clipNodes?.model === model) stopClip(true); };
  setSource(`clip:${name}`);
  $('playBtn').innerHTML = '<span class="icon">stop</span><span>Stop</span>';
  speaker.start();
  model.start();
}

function stopClip(finished) {
  if (!clipNodes) return;
  const { speaker, model } = clipNodes;
  clipNodes = null;
  try { speaker.stop(); model.stop(); } catch {}
  model.disconnect();
  if (finished) send({ clip_end: true });  // lets the server score a clip shorter than one window
  $('playBtn').innerHTML = '<span class="icon">play_arrow</span><span>Play</span>';
  if (micNode) { micNode.connect(tap); setSource('mic'); } else setSource('idle');
}

async function playSelected() {
  const value = $('clip').value;
  if (value === '__file__') return $('file').click();
  if (localFiles.has(value)) return playClip(value.slice(6), await localFiles.get(value).arrayBuffer());
  const res = await fetch(`/clips/${encodeURIComponent(value)}`);
  await playClip(value, await res.arrayBuffer());
}

// ---------- call screen ----------

let callState = 'incoming';             // 'incoming' | 'active' | 'ended'
let callStart = 0, timer = 0;

function answer() {
  if (callState === 'active') return;
  callState = 'active';
  callStart = Date.now();
  $('incoming').classList.add('hidden-state');
  $('incall').classList.remove('hidden-state');
  $('callLabel').textContent = 'Mobile';
  tick();
  timer = setInterval(tick, 1000);
}

function tick() {
  const s = Math.floor((Date.now() - callStart) / 1000);
  $('callMeta').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function hangUp() {
  endSession();
  clearInterval(timer);
  callState = 'ended';
  $('callMeta').textContent = 'Call ended';
  $('incall').classList.add('hidden-state');
  setTimeout(resetCall, 1600);
}

function resetCall() {
  callState = 'incoming';
  scores.length = 0;
  $('verdict').classList.add('hidden');
  $('callLabel').textContent = 'Incoming call';
  $('callMeta').textContent = 'Mobile';
  $('incoming').classList.remove('hidden-state');
}

// ---------- detector card ----------

const scores = [];                      // recent P(fake), oldest first
const MAX_POINTS = 24;

function listening() {
  const v = $('verdict');
  v.classList.remove('hidden', 'stale');
  v.style.color = '#fff';
  $('word').textContent = 'Listening';
  $('word').className = 'word listening';
  $('pct').textContent = '';
  drawGraph();
}

function show(msg) {
  const v = $('verdict');
  if (msg.status === 'quiet') { if (scores.length) v.classList.add('stale'); return; }
  scores.push(msg.p_fake);
  if (scores.length > MAX_POINTS) scores.shift();
  const fake = msg.p_fake >= 0.5;
  // The percentage is the model's confidence in the word shown: P(fake) for FAKE, 1 - P(fake) for REAL.
  const conf = fake ? msg.p_fake : 1 - msg.p_fake;
  v.classList.remove('hidden', 'stale');
  v.style.color = css(fake ? '--fake' : '--real');
  $('word').textContent = fake ? 'FAKE' : 'REAL';
  $('word').className = 'word';
  $('pct').textContent = `${Math.round(conf * 100)}%`;
  v.title = `${msg.label} · P(fake) ${msg.p_fake.toFixed(2)}`;
  drawGraph();
}

// Sparkline of P(fake): top = fake, bottom = real, dashed line = 50% cutoff.
function drawGraph() {
  const W = 300, H = 54, pad = 4;
  const n = scores.length;
  if (!n) { $('line').setAttribute('d', ''); $('area').setAttribute('d', ''); $('dot').setAttribute('r', 0); return; }
  const x = (i) => n === 1 ? W : (i / (MAX_POINTS - 1)) * W + (MAX_POINTS - n) / (MAX_POINTS - 1) * W;
  const y = (p) => pad + (1 - p) * (H - 2 * pad);
  const pts = scores.map((p, i) => [x(i), y(p)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {  // smooth with midpoint curves
    const [px, py] = pts[i - 1], [cx, cy] = pts[i];
    d += ` Q${px},${py} ${(px + cx) / 2},${(py + cy) / 2}`;
  }
  d += ` T${pts[n - 1][0]},${pts[n - 1][1]}`;
  $('line').setAttribute('d', d);
  $('area').setAttribute('d', `${d} L${pts[n - 1][0]},${H} L${pts[0][0]},${H} Z`);
  $('dot').setAttribute('cx', pts[n - 1][0]);
  $('dot').setAttribute('cy', pts[n - 1][1]);
  $('dot').setAttribute('r', 3.6);
}

const fail = (err) => { $('status').textContent = `Error: ${err.message}`; console.error(err); };

// ---------- wiring ----------

// Shrink the phone (and keep its proportions) when the window is shorter than it.
function fitPhone() {
  const phone = document.querySelector('.phone');
  phone.style.zoom = Math.min(1, (innerHeight - 40) / 822).toFixed(3);
}
fitPhone();
addEventListener('resize', fitPhone);

function updateClock() {
  const d = new Date();
  $('clock').textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
}
updateClock();
setInterval(updateClock, 10000);

fetch('/models').then((r) => r.json()).then((list) => {
  for (const m of list) $('model').add(new Option(m.label, m.id));
});
fetch('/clip-list').then((r) => r.json()).then((list) => {
  for (const name of list) $('clip').add(new Option(name, name));
  $('clip').add(new Option('Choose file…', '__file__'));
  lastClip = $('clip').value;
});

$('model').onchange = () => send({ model: $('model').value });
$('micBtn').onclick = () => (micStream ? stopMic() : startMic().catch(fail));
$('playBtn').onclick = () => (clipNodes ? stopClip(false) : playSelected().catch(fail));
$('clip').onchange = () => {
  if ($('clip').value === '__file__') $('file').click();  // open the picker as soon as it's selected
  else lastClip = $('clip').value;
};
$('file').oncancel = () => { $('clip').value = lastClip; };
$('file').onchange = async () => {
  const f = $('file').files[0];
  $('file').value = '';
  if (!f) return void ($('clip').value = lastClip);
  // Add the file to the dropdown (above "Choose file…") so it can be replayed with Play.
  const value = `local:${f.name}`;
  if (!localFiles.has(value)) $('clip').add(new Option(`${f.name} (your file)`, value), $('clip').options.length - 1);
  localFiles.set(value, f);
  $('clip').value = lastClip = value;
  await playClip(f.name, await f.arrayBuffer()).catch(fail);
};
$('answerBtn').onclick = () => {  // answering the call starts listening to the mic
  answer();
  if (!micStream) startMic().catch(fail);
};
$('declineBtn').onclick = hangUp;
$('endBtn').onclick = hangUp;
</script>
</body>
</html>
